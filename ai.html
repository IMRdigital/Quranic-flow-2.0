<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranicFlow AI Assistant</title>

    <link rel="stylesheet" href="ai.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header class="topbar">
    <h2>🤖 QuranicFlow AI</h2>
</header>

<section class="chat-container">

    <div id="chatBox" class="chat-box">

        <div class="ai-message">
            <div class="avatar">
                🤖
            </div>

            <div class="message">
                <h4>Assalamu Alaikum 👋</h4>

                <p>
                    Welcome to QuranicFlow AI.
                    Ask me about the Quran, authentic Hadith,
                    duas, prophets, Islamic history and general
                    Islamic knowledge.
                </p>
            </div>
        </div>

    </div>

    <div class="suggestions">

        <button class="suggestion">
            📖 Explain Surah Al-Fatihah
        </button>

        <button class="suggestion">
            🤲 Daily Dua
        </button>

        <button class="suggestion">
            🕌 How to Pray Salah?
        </button>

        <button class="suggestion">
            🌙 What breaks a fast?
        </button>

    </div>

    <div class="input-area">

        <input
        type="text"
        id="userInput"
        placeholder="Ask anything about Islam...">

        <button id="sendBtn">
            <i class="fas fa-paper-plane"></i>
        </button>

    </div>

</section>

<script src="ai.js"></script>

</body>
</html>
