<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>99 Names of Allah | QuranicFlow</title>

<link rel="stylesheet" href="style.css">

<style>
.names-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:40px 8%;
}

.name-card{
background:#1B4332;
padding:25px;
border-radius:20px;
text-align:center;
transition:.3s;
}

.name-card:hover{
transform:translateY(-10px);
}

.arabic{
font-size:34px;
color:#D4AF37;
margin-bottom:10px;
}

.meaning{
opacity:.9;
}
</style>

</head>
<body>

<header>
<nav class="navbar">
<div class="logo">☪ QuranicFlow</div>
</nav>
</header>

<section class="section">

<h2 class="section-title">
⭐ 99 Names of Allah
</h2>

<div class="names-grid">

<div class="name-card">
<div class="arabic">الرَّحْمٰن</div>
<h3>Ar-Rahman</h3>
<p class="meaning">The Most Merciful</p>
</div>

<div class="name-card">
<div class="arabic">الرَّحِيم</div>
<h3>Ar-Raheem</h3>
<p class="meaning">The Most Compassionate</p>
</div>

<div class="name-card">
<div class="arabic">الْمَلِك</div>
<h3>Al-Malik</h3>
<p class="meaning">The King</p>
</div>

<div class="name-card">
<div class="arabic">الْقُدُّوس</div>
<h3>Al-Quddus</h3>
<p class="meaning">The Most Holy</p>
</div>

<div class="name-card">
<div class="arabic">السَّلَام</div>
<h3>As-Salam</h3>
<p class="meaning">The Source of Peace</p>
</div>

<div class="name-card">
<div class="arabic">الْمُؤْمِن</div>
<h3>Al-Mu'min</h3>
<p class="meaning">The Giver of Security</p>
</div>

</div>

</section>

</body>
</html>
