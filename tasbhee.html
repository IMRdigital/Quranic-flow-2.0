<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasbeeh Counter | QuranicFlow</title>

<link rel="stylesheet" href="style.css">

<style>
.counter-box{
max-width:500px;
margin:80px auto;
text-align:center;
background:#1B4332;
padding:40px;
border-radius:25px;
box-shadow:0 10px 30px rgba(212,175,55,0.2);
}

.counter{
font-size:80px;
font-weight:bold;
color:#D4AF37;
margin:20px 0;
}

.zikr{
font-size:28px;
margin-bottom:20px;
}

.btns{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
}

.t-btn{
padding:12px 24px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:600;
}

.add{
background:#D4AF37;
color:black;
}

.reset{
background:#dc3545;
color:white;
}

.change{
background:#52B788;
color:white;
}
</style>

</head>
<body>

<header>
<nav class="navbar">
<div class="logo">☪ QuranicFlow</div>
</nav>
</header>

<section class="section">

<h2 class="section-title">
🤲 Tasbeeh Counter
</h2>

<div class="counter-box">

<div class="zikr" id="zikr">
SubhanAllah
</div>

<div class="counter" id="count">
0
</div>

<div class="btns">

<button class="t-btn add" onclick="increment()">
+ Count
</button>

<button class="t-btn reset" onclick="resetCount()">
Reset
</button>

<button class="t-btn change" onclick="changeZikr()">
Change Zikr
</button>

</div>

</div>

</section>

<script>

let count = 0;

let zikrs = [
"SubhanAllah",
"Alhamdulillah",
"Allahu Akbar",
"La ilaha illallah",
"Astaghfirullah"
];

let current = 0;

function increment(){
count++;
document.getElementById("count").innerText = count;
}

function resetCount(){
count = 0;
document.getElementById("count").innerText = count;
}

function changeZikr(){
current++;

if(current >= zikrs.length){
current = 0;
}

document.getElementById("zikr").innerText =
zikrs[current];
}

</script>

</body>
</html>
